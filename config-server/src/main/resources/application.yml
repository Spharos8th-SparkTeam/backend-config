server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: config-server
  config:
    import: optional:file:.env[.properties],optional:file:config-server/.env[.properties]
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI}
          default-label: ${CONFIG_GIT_LABEL:develop}
          clone-on-start: true
          search-paths: config-repo

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
